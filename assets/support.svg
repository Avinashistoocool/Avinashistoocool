<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="440.0" y="22" text-anchor="middle" class="t s dim">claude — /support</text>
<g class="ln" style="animation-delay:0.2s"><text x="24" y="70" class="t"><tspan class="dim">&gt; </tspan><tspan class="b">/support</tspan></text></g><g class="ln" style="animation-delay:0.6s"><circle cx="29" cy="105" r="4" fill="#7fb77e"/><text x="42" y="110" class="t"><tspan class="b">Read</tspan>(WHY.md)</text></g><g class="ln" style="animation-delay:0.90s"><text x="42" y="132" class="t "><tspan class="dim">⎿  </tspan>I build things to understand them: models that read particle jets,</text></g><g class="ln" style="animation-delay:0.98s"><text x="42" y="153" class="t "><tspan class="dim">   </tspan>maps of ice on the Moon, rescue drone swarms, and small tools that</text></g><g class="ln" style="animation-delay:1.06s"><text x="42" y="174" class="t "><tspan class="dim">   </tspan>help students reach researchers. All of it is open source, and all</text></g><g class="ln" style="animation-delay:1.14s"><text x="42" y="195" class="t "><tspan class="dim">   </tspan>of it runs on a student laptop.</text></g><g class="ln" style="animation-delay:1.4s"><circle cx="29" cy="233" r="4" fill="#7fb77e"/><text x="42" y="238" class="t"><tspan class="b">Read</tspan>(where-it-goes.md)</text></g><g class="ln" style="animation-delay:1.50s"><text x="42" y="260" class="t "><tspan class="dim">⎿  </tspan><tspan class="or">$</tspan></text><text x="70" y="260" class="t b">GPU hours for bigger training runs</text></g><g class="ln" style="animation-delay:1.58s"><text x="42" y="281" class="t "><tspan class="dim">   </tspan><tspan class="or">$</tspan></text><text x="70" y="281" class="t b">datasets, storage and cloud compute</text></g><g class="ln" style="animation-delay:1.66s"><text x="42" y="302" class="t "><tspan class="dim">   </tspan><tspan class="or">$</tspan></text><text x="70" y="302" class="t b">parts for robotics and drone builds</text></g><g class="ln" style="animation-delay:1.74s"><text x="42" y="323" class="t "><tspan class="dim">   </tspan><tspan class="or">$</tspan></text><text x="70" y="323" class="t b">keeping my tools free for other students</text></g><g class="ln" style="animation-delay:2.1s"><circle cx="29" cy="361" r="4" fill="#e6e6e6"/><text x="42" y="366" class="t b">8 public projects so far, each one shared as it&#x27;s built.</text><text x="42" y="388" class="t b">A coffee goes straight into the next experiment. Thank you.</text></g><g class="ln" style="animation-delay:2.6s"><text x="42" y="420" class="t or">↓ buymeacoffee.com/avinashistoocool</text></g>
</svg>