<text x="450.0" y="23" text-anchor="middle" class="t dim" style="font-size:12px">avinash@iitd: ~/github — claude</text>
<rect x="24" y="54" width="520" height="104" rx="6" fill="none" stroke="#d97757" stroke-width="1.2"/>
<text x="42" y="84" class="t"><tspan class="or b">✻</tspan> Welcome to <tspan class="b">Avinash's</tspan> GitHub</text>
<text x="66" y="110" class="t dim">/help for help, /status for your current setup</text>
<text x="66" y="132" class="t dim">cwd: ~/iit-delhi/physics</text>
<text x="66" y="150" class="t dim" style="font-size:12px">model: physics × deep learning × computer vision</text>
<text x="24.0" y="234" class="t ln" style="animation-delay:0.80s"><tspan class="dim">&gt; </tspan><tspan class="b">/about</tspan></text>
<text x="24.0" y="262" class="t ln" style="animation-delay:0.86s"><tspan class="or">⏺ </tspan>I&#x27;m <tspan class="b">Avinash</tspan>, a physics student at <tspan class="b">IIT Delhi</tspan>. I build ML systems for physics,</text>
<text x="40.9" y="282" class="t ln" style="animation-delay:0.92s">remote sensing and robotics, and the tooling around them.</text>
<text x="24.0" y="310" class="t ln" style="animation-delay:0.98s"><tspan class="or">⏺ </tspan><tspan class="b">Read</tspan>(<tspan class="bl">now.md</tspan>)</text>
<text x="40.9" y="330" class="t ln" style="animation-delay:1.04s"><tspan class="dim">⎿  </tspan>Transformer architectures for jet tagging on JetClass; next step is a <tspan class="pk">Mixture-of-Experts</tspan> model</text>
<text x="40.9" y="350" class="t ln" style="animation-delay:1.10s">   Interested in PyTorch internals, novel architectures, agentic systems and CV</text>
<text x="24.0" y="378" class="t ln" style="animation-delay:1.16s"><tspan class="or">⏺ </tspan><tspan class="b">Bash</tspan>(<tspan class="bl">ls ~/projects --by-code</tspan>)</text>
<text x="40.9" y="398" class="t ln" style="animation-delay:1.22s"><tspan class="dim">⎿  </tspan><tspan class="grb">Gated-Dual-Stream-Particle-Transformer/</tspan><tspan class="yl">  PyTorch</tspan></text>
<text x="66.2" y="417" class="t ln" style="animation-delay:1.28s"><tspan class="dim">Pairwise particle physics as multiplicative gates on Q/K plus an additive attention bias.</tspan></text>
<text x="66.2" y="436" class="t ln" style="animation-delay:1.34s"><tspan class="dim">Ragged on-disk cache, GPU pairwise features, EMA, AMP. 2.07M params.</tspan></text>
<text x="66.2" y="455" class="t ln" style="animation-delay:1.40s"><tspan class="dim">JetClass-10M test: </tspan><tspan class="gr">84.8% acc, 0.985 AUC</tspan><tspan class="dim">  (ParT 10M: 85.0%, 0.986)</tspan></text>
<text x="40.9" y="477" class="t ln" style="animation-delay:1.46s"><tspan class="dim">   </tspan><tspan class="grb">ISRO-BAH-26/</tspan><tspan class="yl">  rasterio · GDAL</tspan></text>
<text x="66.2" y="496" class="t ln" style="animation-delay:1.52s"><tspan class="dim">Chandrayaan-2 DFSAR CPR/DOP fused with slope and roughness into a lunar ice probability map.</tspan></text>
<text x="66.2" y="515" class="t ln" style="animation-delay:1.58s"><tspan class="dim">Streams LOLA DEM tiles over /vsicurl, builds a slope cost map, octile A* to Faustini crater.</tspan></text>
<text x="40.9" y="537" class="t ln" style="animation-delay:1.64s"><tspan class="dim">   </tspan><tspan class="grb">Agnostos-v2/</tspan><tspan class="yl">  LLM · SMTP</tspan></text>
<text x="66.2" y="556" class="t ln" style="animation-delay:1.70s"><tspan class="dim">Outreach CLI: resume parsing, OpenAlex discovery, email verification, LLM drafts with a</tspan></text>
<text x="66.2" y="575" class="t ln" style="animation-delay:1.76s"><tspan class="dim">humanizing pass, paced sends in each recipient&#x27;s local hours, and reply tracking.</tspan></text>
<text x="40.9" y="597" class="t ln" style="animation-delay:1.82s"><tspan class="dim">   </tspan><tspan class="grb">asclepius/</tspan><tspan class="yl">  shapely · YOLO</tspan></text>
<text x="66.2" y="616" class="t ln" style="animation-delay:1.88s"><tspan class="dim">Search-and-rescue drone swarm: polygon to search lanes, min-makespan fleet balancing,</tspan></text>
<text x="66.2" y="635" class="t ln" style="animation-delay:1.94s"><tspan class="dim">Hungarian dispatch of delivery drones, YOLO-World person detection.</tspan></text>
<text x="40.9" y="657" class="t ln" style="animation-delay:2.00s"><tspan class="dim">   </tspan><tspan class="grb">eraksha-hackathon/</tspan><tspan class="yl">  scapy · Flask</tspan></text>
<text x="66.2" y="676" class="t ln" style="animation-delay:2.06s"><tspan class="dim">Home-network anomaly detector: scapy sniffing, ARP + nmap scans, port-risk scoring,</tspan></text>
<text x="66.2" y="695" class="t ln" style="animation-delay:2.12s"><tspan class="dim">SQLite flow store, Flask dashboard and a Google ADK agent.</tspan></text>
<text x="40.9" y="717" class="t ln" style="animation-delay:2.18s"><tspan class="dim">   </tspan><tspan class="grb">Jet-Class-Particle-Visualizer/</tspan><tspan class="yl">  uproot</tspan></text>
<text x="66.2" y="736" class="t ln" style="animation-delay:2.24s"><tspan class="dim">JetClass ROOT to (eta, phi) clouds, class heatmaps, spectra and radial profiles.</tspan></text>
<text x="40.9" y="758" class="t ln" style="animation-delay:2.30s"><tspan class="dim">   </tspan><tspan class="grb">Object-tracking-with-color/</tspan><tspan class="yl">  OpenCV</tspan></text>
<text x="66.2" y="777" class="t ln" style="animation-delay:2.36s"><tspan class="dim">HSV colour tracking with trajectory plots and annotated video output.</tspan></text>
<text x="24.0" y="805" class="t ln" style="animation-delay:2.42s"><tspan class="or">⏺ </tspan><tspan class="b">Update Todos</tspan></text>
<text x="40.9" y="825" class="t ln" style="animation-delay:2.48s"><tspan class="dim">⎿  </tspan><tspan class="gr">☒ </tspan><tspan class="dim">Match ParT on JetClass-10M with gated dual-stream attention</tspan></text>
<text x="40.9" y="845" class="t ln" style="animation-delay:2.54s">   <tspan class="or">☐ </tspan><tspan class="b">Mixture-of-Experts jet tagger</tspan></text>
<text x="40.9" y="865" class="t ln" style="animation-delay:2.60s">   ☐ Lunar ice map to rover traverse, end to end</text>
<text x="24.0" y="899" class="t ln" style="animation-delay:3.10s"><tspan class="dim">&gt; </tspan><tspan class="b">/stack</tspan></text>
<text x="24.0" y="927" class="t ln" style="animation-delay:3.16s"><tspan class="or">⏺ </tspan><tspan class="yl">Python</tspan><tspan class="dim"> · </tspan><tspan class="or">PyTorch</tspan><tspan class="dim"> · </tspan><tspan class="bl">NumPy / SciPy</tspan><tspan class="dim"> · </tspan><tspan class="pk">OpenCV</tspan><tspan class="dim"> · </tspan><tspan class="yl">uproot / awkward</tspan><tspan class="dim"> · </tspan><tspan class="bl">rasterio / GDAL</tspan></text>
<text x="40.9" y="947" class="t ln" style="animation-delay:3.22s"><tspan class="pk">shapely</tspan><tspan class="dim"> · </tspan><tspan class="or">ultralytics</tspan><tspan class="dim"> · </tspan><tspan class="yl">scapy</tspan><tspan class="dim"> · </tspan><tspan class="bl">Flask</tspan><tspan class="dim"> · </tspan><tspan class="pk">SQLite</tspan><tspan class="dim"> · </tspan><tspan class="or">LLM APIs</tspan></text>
<text x="24.0" y="981" class="t ln" style="animation-delay:3.72s"><tspan class="dim">&gt; </tspan><tspan class="b">/contact</tspan></text>
<text x="24.0" y="1009" class="t ln" style="animation-delay:3.78s"><tspan class="or">⏺ </tspan><tspan class="dim">mail      </tspan><tspan class="bl">ph1251520@physics.iitd.ac.in</tspan></text>
<text x="40.9" y="1029" class="t ln" style="animation-delay:3.84s"><tspan class="dim">linkedin  </tspan><tspan class="bl">linkedin.com/in/avinashistoocool</tspan></text>
<text x="40.9" y="1049" class="t ln" style="animation-delay:3.90s"><tspan class="dim">github    </tspan><tspan class="bl">github.com/Avinashistoocool</tspan></text>
